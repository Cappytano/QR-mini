<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR-Reader v6.0.2 (patched)</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <!-- FIX: use UMD build (non-module) to avoid 'Unexpected token export' -->
  <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
  <script>
    /* FIX: set worker path explicitly when using CDN */
    window.QrScanner && (QrScanner.WORKER_PATH = "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner-worker.min.js");
  </script>
</head>
<body>
  <header>
    <h1>QR-Reader <small>v6.0.2 (patched)</small></h1>
    <div class="pills">
      <span id="enginePill" class="pill">Engine: QR-Scanner UMD</span>
      <span id="permPill" class="pill">Permission: unknown</span>
    </div>
  </header>

  <main>
    <section class="controls">
      <button id="permBtn" type="button">Request Permission</button>
      <select id="cameraSelect" title="Choose camera"></select>
      <button id="startBtn" type="button">Start Camera</button>
      <button id="stopBtn" type="button">Stop</button>
    </section>

    <section class="preview">
      <video id="video" playsinline muted></video>
      <canvas id="captureCanvas" class="hidden"></canvas>
    </section>

    <section class="log">
      <table id="logTable" aria-label="Scan log">
        <thead>
          <tr>
            <th>#</th>
            <th>Content</th>
            <th>Format</th>
            <th>Date</th>
            <th>Time</th>
            <th>Photo</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
